<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scores | NEFB Report</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f4;
      color: #111;
    }

    /* HEADER */

    header {
      background: #111;
      color: white;
      padding: 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 22px;
      font-weight: 700;
      font-size: 14px;
    }

    nav a:hover {
      opacity: 0.7;
    }

    /* PAGE */

    .container {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px 60px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    /* FILTERS */

    .filters {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    select {
      padding: 11px 15px;
      border-radius: 7px;
      border: 1px solid #ccc;
      background: white;
      font-size: 15px;
      cursor: pointer;
    }

    /* DATE */

    .date-section {
      margin-bottom: 35px;
    }

    .date-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 12px;
      border-bottom: 2px solid #111;
      padding-bottom: 8px;
    }

    /* GAME */

    .game {
      background: white;
      border-radius: 8px;
      margin-bottom: 10px;
      padding: 16px 18px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .team {
      display: grid;
      grid-template-columns: 45px 1fr 50px;
      align-items: center;
      padding: 6px 0;
    }

    .state {
      color: #888;
      font-size: 12px;
      font-weight: 700;
    }

    .team-name {
      font-size: 16px;
      font-weight: 700;
    }

    .score {
      font-size: 18px;
      font-weight: 900;
      text-align: right;
    }

    .game-footer {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #eee;
      font-size: 11px;
      font-weight: 800;
      color: #777;
      text-transform: uppercase;
    }

    /* LOADING / ERROR */

    #loading {
      text-align: center;
      padding: 50px;
      color: #666;
    }

    #error {
      display: none;
      background: #ffe7e7;
      padding: 18px;
      border-radius: 8px;
      margin-top: 20px;
    }

    .no-games {
      background: white;
      padding: 25px;
      border-radius: 8px;
      color: #666;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .header-inner {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }

      nav a {
        margin-left: 0;
        margin-right: 15px;
      }

      h1 {
        font-size: 30px;
      }

      .filters {
        flex-direction: column;
      }

      select {
        width: 100%;
      }

    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">
      NEFB REPORT
    </div>

    <nav>
      <a href="/">Home</a>
      <a href="/scores.html">Scores</a>
    </nav>

  </div>
</header>


<main class="container">

  <h1>New England Football Scores</h1>

  <div class="subtitle">
    High school football scores from across New England.
  </div>


  <div class="filters">

    <select id="weekFilter">
      <option value="all">All Weeks</option>
      <option value="1">Week 1</option>
      <option value="2">Week 2</option>
      <option value="3">Week 3</option>
    </select>


    <select id="stateFilter">
      <option value="all">All States</option>
      <option value="MA">Massachusetts</option>
      <option value="CT">Connecticut</option>
      <option value="RI">Rhode Island</option>
      <option value="NH">New Hampshire</option>
      <option value="ME">Maine</option>
      <option value="VT">Vermont</option>
    </select>

  </div>


  <div id="loading">
    Loading scores...
  </div>

  <div id="error">
    Scores could not be loaded.
  </div>

  <div id="scores"></div>

</main>


<script>

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTmxfGq5QWxATSTWk3V0ZZMyukHkw4kBamLh6xOhe4qqKeMi-T_zxNtFHZDPoSv8c-puqUWoW60v2X8/pub?gid=0&single=true&output=csv";


let allGames = [];


/* LOAD GOOGLE SHEET */

async function loadScores() {

  try {

    const response = await fetch(SHEET_URL);

    if (!response.ok) {
      throw new Error("Could not load spreadsheet");
    }

    const csv = await response.text();

    const rows = parseCSV(csv);

    if (rows.length < 2) {
      throw new Error("Spreadsheet is empty");
    }

    const headers = rows[0].map(header => header.trim());

    allGames = rows.slice(1)
      .filter(row => row.some(cell => cell.trim() !== ""))
      .map(row => {

        const game = {};

        headers.forEach((header, index) => {
          game[header] = row[index]
            ? row[index].trim()
            : "";
        });

        return game;

      });


    document.getElementById("loading").style.display = "none";

    renderScores();

  }

  catch (error) {

    console.error(error);

    document.getElementById("loading").style.display = "none";
    document.getElementById("error").style.display = "block";

  }

}


/* CSV PARSER */

function parseCSV(text) {

  const rows = [];

  let row = [];
  let cell = "";
  let insideQuotes = false;


  for (let i = 0; i < text.length; i++) {

    const character = text[i];

    const nextCharacter = text[i + 1];


    if (character === '"') {

      if (insideQuotes && nextCharacter === '"') {

        cell += '"';

        i++;

      }

      else {

        insideQuotes = !insideQuotes;

      }

    }

    else if (character === "," && !insideQuotes) {

      row.push(cell);

      cell = "";

    }

    else if (
      (character === "\n" || character === "\r")
      && !insideQuotes
    ) {

      if (character === "\r" && nextCharacter === "\n") {
        i++;
      }

      row.push(cell);

      rows.push(row);

      row = [];
      cell = "";

    }

    else {

      cell += character;

    }

  }


  if (cell.length || row.length) {

    row.push(cell);

    rows.push(row);

  }


  return rows;

}


/* DATE FORMAT */

function formatDate(dateString) {

  if (!dateString) return "";


  const parts = dateString.split("/");


  if (parts.length === 3) {

    const month = Number(parts[0]);
    const day = Number(parts[1]);
    const year = Number(parts[2]);

    const date = new Date(
      year,
      month - 1,
      day
    );


    return date.toLocaleDateString(
      "en-US",
      {
        weekday: "long",
        month: "long",
        day: "numeric"
      }
    );

  }


  return dateString;

}


/* SAFE HTML */

function escapeHTML(value) {

  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* DISPLAY SCORES */

function renderScores() {

  const scoresContainer =
    document.getElementById("scores");


  const selectedWeek =
    document.getElementById("weekFilter").value;


  const selectedState =
    document.getElementById("stateFilter").value;


  let games = allGames.filter(game => {

    const weekMatches =
      selectedWeek === "all" ||
      game["Week"] === selectedWeek;


    const stateMatches =
      selectedState === "all" ||
      game["Away State"] === selectedState ||
      game["Home State"] === selectedState;


    return weekMatches && stateMatches;

  });


  /* SORT BY DATE */

  games.sort((a, b) => {

    return new Date(a["Date"]) -
           new Date(b["Date"]);

  });


  if (!games.length) {

    scoresContainer.innerHTML =
      '<div class="no-games">No games found.</div>';

    return;

  }


  /* GROUP BY DATE */

  const groupedGames = {};


  games.forEach(game => {

    const date = game["Date"] || "Unknown Date";

    if (!groupedGames[date]) {
      groupedGames[date] = [];
    }

    groupedGames[date].push(game);

  });


  let html = "";


  Object.keys(groupedGames).forEach(date => {

    html += `
      <section class="date-section">

        <div class="date-title">
          ${escapeHTML(formatDate(date))}
        </div>
    `;


    groupedGames[date].forEach(game => {

      html += `

        <div class="game">

          <div class="team">

            <div class="state">
              ${escapeHTML(game["Away State"])}
            </div>

            <div class="team-name">
              ${escapeHTML(game["Away Team"])}
            </div>

            <div class="score">
              ${escapeHTML(game["Away Score"])}
            </div>

          </div>


          <div class="team">

            <div class="state">
              ${escapeHTML(game["Home State"])}
            </div>

            <div class="team-name">
              ${escapeHTML(game["Home Team"])}
            </div>

            <div class="score">
              ${escapeHTML(game["Home Score"])}
            </div>

          </div>


          <div class="game-footer">

            ${escapeHTML(game["Status"] || "Final")}
            &nbsp; • &nbsp;
            Week ${escapeHTML(game["Week"])}

          </div>

        </div>

      `;

    });


    html += `</section>`;

  });


  scoresContainer.innerHTML = html;

}


/* FILTER EVENTS */

document
  .getElementById("weekFilter")
  .addEventListener(
    "change",
    renderScores
  );


document
  .getElementById("stateFilter")
  .addEventListener(
    "change",
    renderScores
  );


/* START */

loadScores();

</script>

</body>
</html>
