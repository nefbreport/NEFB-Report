<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scores | NEFB Report</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f4;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 22px;
      font-weight: 700;
      font-size: 14px;
    }

    nav a:hover {
      opacity: 0.7;
    }

    .container {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px 60px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    .filters {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    select {
      padding: 11px 15px;
      border-radius: 7px;
      border: 1px solid #ccc;
      background: white;
      font-size: 15px;
      cursor: pointer;
    }

    .date-section {
      margin-bottom: 35px;
    }

    .date-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 12px;
      border-bottom: 2px solid #111;
      padding-bottom: 8px;
    }

    .game {
      background: white;
      border-radius: 8px;
      margin-bottom: 10px;
      padding: 16px 18px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .team {
      display: grid;
      grid-template-columns: 70px minmax(0, 1fr) auto 50px;
      align-items: center;
      gap: 10px;
      padding: 7px 0;
    }

    .association {
      color: #888;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .team-name {
      font-size: 16px;
      font-weight: 700;
      min-width: 0;
    }

    .record {
      color: #777;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .score {
      font-size: 18px;
      font-weight: 900;
      text-align: right;
    }

    .winner .team-name,
    .winner .score {
      font-weight: 900;
    }

    .game-footer {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #eee;
      font-size: 11px;
      font-weight: 800;
      color: #777;
      text-transform: uppercase;
    }

    .association-label {
      display: inline-block;
      background: #111;
      color: #fff;
      padding: 3px 6px;
      border-radius: 4px;
      margin-left: 6px;
      font-size: 9px;
      letter-spacing: .5px;
    }

    #loading {
      text-align: center;
      padding: 50px;
      color: #666;
    }

    #error {
      display: none;
      background: #ffe7e7;
      padding: 18px;
      border-radius: 8px;
      margin-top: 20px;
    }

    .no-games {
      background: white;
      padding: 25px;
      border-radius: 8px;
      color: #666;
    }

    @media (max-width: 700px) {
      .header-inner {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }

      nav a {
        margin-left: 0;
        margin-right: 15px;
      }

      h1 {
        font-size: 30px;
      }

      .filters {
        flex-direction: column;
      }

      select {
        width: 100%;
      }

      .team {
        grid-template-columns: 58px minmax(0, 1fr) auto 38px;
        gap: 7px;
      }

      .association {
        font-size: 9px;
      }

      .team-name {
        font-size: 14px;
      }

      .record {
        font-size: 11px;
      }

      .score {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">
      NEFB REPORT
    </div>

    <nav>
      <a href="/">Home</a>
      <a href="/scores.html">Scores</a>
    </nav>

  </div>
</header>


<main class="container">

  <h1>New England Football Scores</h1>

  <div class="subtitle">
    High school and prep football scores from across New England.
  </div>


  <div class="filters">

    <select id="weekFilter">
      <option value="all">All Weeks</option>
    </select>

    <select id="associationFilter">
      <option value="all">All Associations</option>
    </select>

  </div>


  <div id="loading">
    Loading scores...
  </div>

  <div id="error">
    Scores could not be loaded.
  </div>

  <div id="scores"></div>

</main>


<script>

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTmxfGq5QWxATSTWk3V0ZZMyukHkw4kBamLh6xOhe4qqKeMi-T_zxNtFHZDPoSv8c-puqUWoW60v2X8/pub?gid=0&single=true&output=csv";


let allGames = [];


/*
-----------------------------------------
LOAD GOOGLE SHEET
-----------------------------------------
*/

async function loadScores() {

  try {

    const response = await fetch(SHEET_URL);

    if (!response.ok) {
      throw new Error("Could not load spreadsheet");
    }

    const csv = await response.text();

    const rows = parseCSV(csv);

    if (rows.length < 2) {
      throw new Error("Spreadsheet is empty");
    }

    const headers =
      rows[0].map(header => header.trim());


    allGames =
      rows
        .slice(1)
        .filter(row =>
          row.some(cell => cell.trim() !== "")
        )
        .map((row, index) => {

          const game = {};

          headers.forEach((header, columnIndex) => {
            game[header] =
              row[columnIndex]
                ? row[columnIndex].trim()
                : "";
          });

          game._originalIndex = index;

          return game;

        });


    /*
    -----------------------------------------
    PREPARE GAME DATA
    -----------------------------------------
    */

    prepareGames();

    buildWeekFilter();

    buildAssociationFilter();


    document
      .getElementById("loading")
      .style.display = "none";


    renderScores();

  }

  catch (error) {

    console.error(error);

    document
      .getElementById("loading")
      .style.display = "none";

    document
      .getElementById("error")
      .style.display = "block";

  }

}


/*
-----------------------------------------
CSV PARSER
-----------------------------------------
*/

function parseCSV(text) {

  const rows = [];

  let row = [];
  let cell = "";
  let insideQuotes = false;


  for (let i = 0; i < text.length; i++) {

    const character = text[i];
    const nextCharacter = text[i + 1];


    if (character === '"') {

      if (
        insideQuotes &&
        nextCharacter === '"'
      ) {

        cell += '"';
        i++;

      }

      else {

        insideQuotes = !insideQuotes;

      }

    }

    else if (
      character === "," &&
      !insideQuotes
    ) {

      row.push(cell);
      cell = "";

    }

    else if (
      (
        character === "\n" ||
        character === "\r"
      ) &&
      !insideQuotes
    ) {

      if (
        character === "\r" &&
        nextCharacter === "\n"
      ) {
        i++;
      }

      row.push(cell);
      rows.push(row);

      row = [];
      cell = "";

    }

    else {

      cell += character;

    }

  }


  if (
    cell.length ||
    row.length
  ) {

    row.push(cell);
    rows.push(row);

  }


  return rows;

}


/*
-----------------------------------------
NORMALIZE WEEK
-----------------------------------------
*/

function normalizeWeek(week) {

  return String(week || "")
    .replace(/week\s*/i, "")
    .trim();

}


/*
-----------------------------------------
DATE VALUE
-----------------------------------------
*/

function getDateValue(dateString) {

  if (!dateString) {
    return 0;
  }

  const parts = dateString.split("/");

  if (parts.length === 3) {

    const month = Number(parts[0]);
    const day = Number(parts[1]);
    const year = Number(parts[2]);

    return new Date(
      year,
      month - 1,
      day
    ).getTime();

  }

  return new Date(dateString).getTime() || 0;

}


/*
-----------------------------------------
DATE FORMAT
-----------------------------------------
*/

function formatDate(dateString) {

  if (!dateString) {
    return "";
  }

  const parts = dateString.split("/");


  if (parts.length === 3) {

    const month = Number(parts[0]);
    const day = Number(parts[1]);
    const year = Number(parts[2]);


    const date =
      new Date(
        year,
        month - 1,
        day
      );


    return date.toLocaleDateString(
      "en-US",
      {
        weekday: "long",
        month: "long",
        day: "numeric"
      }
    );

  }


  return dateString;

}


/*
-----------------------------------------
SAFE HTML
-----------------------------------------
*/

function escapeHTML(value) {

  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/*
-----------------------------------------
NORMALIZE TEAM NAME FOR RECORDS
-----------------------------------------
*/

function normalizeTeamName(name) {

  return String(name || "")
    .toLowerCase()
    .replace(/[.’']/g, "")
    .replace(/&/g, "and")
    .replace(/-/g, " ")
    .replace(/\s+/g, " ")
    .trim();

}


/*
-----------------------------------------
CHECK FINAL
-----------------------------------------
*/

function isFinalGame(game) {

  return String(game["Status"] || "")
    .toLowerCase()
    .includes("final");

}


/*
-----------------------------------------
PREPARE GAMES + CALCULATE RECORDS
-----------------------------------------

Records shown are the team's record
AFTER that particular game.

Example:

Week 1: 1-0
Week 2: 2-0
Week 3: 2-1

-----------------------------------------
*/

function prepareGames() {

  const chronologicalGames =
    [...allGames].sort((a, b) => {

      const dateDifference =
        getDateValue(a["Date"]) -
        getDateValue(b["Date"]);

      if (dateDifference !== 0) {
        return dateDifference;
      }

      return (
        a._originalIndex -
        b._originalIndex
      );

    });


  const records = {};


  chronologicalGames.forEach(game => {

    const awayTeam =
      normalizeTeamName(
        game["Away Team"]
      );

    const homeTeam =
      normalizeTeamName(
        game["Home Team"]
      );


    if (!records[awayTeam]) {
      records[awayTeam] = {
        wins: 0,
        losses: 0,
        ties: 0
      };
    }

    if (!records[homeTeam]) {
      records[homeTeam] = {
        wins: 0,
        losses: 0,
        ties: 0
      };
    }


    if (isFinalGame(game)) {

      const awayScore =
        Number(game["Away Score"]);

      const homeScore =
        Number(game["Home Score"]);


      if (
        Number.isFinite(awayScore) &&
        Number.isFinite(homeScore)
      ) {

        if (awayScore > homeScore) {

          records[awayTeam].wins++;
          records[homeTeam].losses++;

        }

        else if (homeScore > awayScore) {

          records[homeTeam].wins++;
          records[awayTeam].losses++;

        }

        else {

          records[awayTeam].ties++;
          records[homeTeam].ties++;

        }

      }

    }


    game._awayRecord =
      formatRecord(
        records[awayTeam]
      );

    game._homeRecord =
      formatRecord(
        records[homeTeam]
      );

  });

}


/*
-----------------------------------------
FORMAT RECORD
-----------------------------------------
*/

function formatRecord(record) {

  if (!record) {
    return "0-0";
  }

  if (record.ties > 0) {

    return (
      record.wins +
      "-" +
      record.losses +
      "-" +
      record.ties
    );

  }

  return (
    record.wins +
    "-" +
    record.losses
  );

}


/*
-----------------------------------------
AUTOMATIC WEEK FILTER
-----------------------------------------
*/

function buildWeekFilter() {

  const weekFilter =
    document.getElementById(
      "weekFilter"
    );


  const weeks =
    [
      ...new Set(
        allGames
          .map(game =>
            normalizeWeek(
              game["Week"]
            )
          )
          .filter(Boolean)
      )
    ];


  weeks.sort((a, b) => {

    const numberA = Number(a);
    const numberB = Number(b);

    if (
      Number.isFinite(numberA) &&
      Number.isFinite(numberB)
    ) {
      return numberA - numberB;
    }

    return a.localeCompare(b);

  });


  weeks.forEach(week => {

    const option =
      document.createElement(
        "option"
      );

    option.value = week;
    option.textContent =
      "Week " + week;

    weekFilter.appendChild(option);

  });

}


/*
-----------------------------------------
AUTOMATIC ASSOCIATION FILTER
-----------------------------------------
*/

function buildAssociationFilter() {

  const associationFilter =
    document.getElementById(
      "associationFilter"
    );


  const preferredOrder = [
    "MIAA",
    "CIAC",
    "RIIL",
    "NHIAA",
    "MPA",
    "VPA",
    "NEPSAC"
  ];


  const associations =
    [
      ...new Set(
        allGames
          .flatMap(game => [
            game["Away Association"],
            game["Home Association"]
          ])
          .map(value =>
            String(value || "").trim()
          )
          .filter(Boolean)
      )
    ];


  associations.sort((a, b) => {

    const indexA =
      preferredOrder.indexOf(a);

    const indexB =
      preferredOrder.indexOf(b);


    if (
      indexA !== -1 &&
      indexB !== -1
    ) {
      return indexA - indexB;
    }

    if (indexA !== -1) {
      return -1;
    }

    if (indexB !== -1) {
      return 1;
    }

    return a.localeCompare(b);

  });


  associations.forEach(
    association => {

      const option =
        document.createElement(
          "option"
        );

      option.value = association;
      option.textContent = association;

      associationFilter
        .appendChild(option);

    }
  );

}


/*
-----------------------------------------
DISPLAY SCORES
-----------------------------------------
*/

function renderScores() {

  const scoresContainer =
    document.getElementById(
      "scores"
    );


  const selectedWeek =
    document.getElementById(
      "weekFilter"
    ).value;


  const selectedAssociation =
    document.getElementById(
      "associationFilter"
    ).value;


  let games =
    allGames.filter(game => {


      const weekMatches =
        selectedWeek === "all" ||
        normalizeWeek(
          game["Week"]
        ) === selectedWeek;


      const associationMatches =
        selectedAssociation === "all" ||
        game["Away Association"] ===
          selectedAssociation ||
        game["Home Association"] ===
          selectedAssociation;


      return (
        weekMatches &&
        associationMatches
      );

    });


  /*
  -----------------------------------------
  SORT BY DATE
  -----------------------------------------
  */

  games.sort((a, b) => {

    const dateDifference =
      getDateValue(a["Date"]) -
      getDateValue(b["Date"]);

    if (dateDifference !== 0) {
      return dateDifference;
    }

    return (
      a._originalIndex -
      b._originalIndex
    );

  });


  if (!games.length) {

    scoresContainer.innerHTML =
      '<div class="no-games">No games found for these filters.</div>';

    return;

  }


  /*
  -----------------------------------------
  GROUP BY DATE
  -----------------------------------------
  */

  const groupedGames = {};


  games.forEach(game => {

    const date =
      game["Date"] ||
      "Unknown Date";


    if (!groupedGames[date]) {
      groupedGames[date] = [];
    }


    groupedGames[date]
      .push(game);

  });


  let html = "";


  Object
    .keys(groupedGames)
    .forEach(date => {


      html += `

        <section class="date-section">

          <div class="date-title">
            ${escapeHTML(
              formatDate(date)
            )}
          </div>

      `;


      groupedGames[date]
        .forEach(game => {


          const awayScore =
            Number(
              game["Away Score"]
            );

          const homeScore =
            Number(
              game["Home Score"]
            );


          const awayWinner =
            isFinalGame(game) &&
            Number.isFinite(awayScore) &&
            Number.isFinite(homeScore) &&
            awayScore > homeScore;


          const homeWinner =
            isFinalGame(game) &&
            Number.isFinite(awayScore) &&
            Number.isFinite(homeScore) &&
            homeScore > awayScore;


          const awayAssociation =
            game["Away Association"] ||
            "";


          const homeAssociation =
            game["Home Association"] ||
            "";


          let associationLabel = "";


          if (
            awayAssociation ===
              homeAssociation &&
            awayAssociation
          ) {

            associationLabel =
              awayAssociation;

          }

          else if (
            awayAssociation ||
            homeAssociation
          ) {

            associationLabel =
              [
                awayAssociation,
                homeAssociation
              ]
                .filter(Boolean)
                .join(" vs ");

          }


          html += `

            <div class="game">


              <div class="team ${awayWinner ? "winner" : ""}">

                <div class="association">
                  ${escapeHTML(
                    awayAssociation
                  )}
                </div>

                <div class="team-name">
                  ${escapeHTML(
                    game["Away Team"]
                  )}
                </div>

                <div class="record">
                  (${escapeHTML(
                    game._awayRecord ||
                    "0-0"
                  )})
                </div>

                <div class="score">
                  ${escapeHTML(
                    game["Away Score"]
                  )}
                </div>

              </div>


              <div class="team ${homeWinner ? "winner" : ""}">

                <div class="association">
                  ${escapeHTML(
                    homeAssociation
                  )}
                </div>

                <div class="team-name">
                  ${escapeHTML(
                    game["Home Team"]
                  )}
                </div>

                <div class="record">
                  (${escapeHTML(
                    game._homeRecord ||
                    "0-0"
                  )})
                </div>

                <div class="score">
                  ${escapeHTML(
                    game["Home Score"]
                  )}
                </div>

              </div>


              <div class="game-footer">

                ${escapeHTML(
                  game["Status"] ||
                  "Final"
                )}

                &nbsp; • &nbsp;

                Week
                ${escapeHTML(
                  normalizeWeek(
                    game["Week"]
                  )
                )}

                ${
                  associationLabel
                    ? `
                      <span class="association-label">
                        ${escapeHTML(
                          associationLabel
                        )}
                      </span>
                    `
                    : ""
                }

              </div>

            </div>

          `;

        });


      html +=
        `</section>`;

    });


  scoresContainer.innerHTML =
    html;

}


/*
-----------------------------------------
FILTER EVENTS
-----------------------------------------
*/

document
  .getElementById(
    "weekFilter"
  )
  .addEventListener(
    "change",
    renderScores
  );


document
  .getElementById(
    "associationFilter"
  )
  .addEventListener(
    "change",
    renderScores
  );


/*
-----------------------------------------
START WEBSITE
-----------------------------------------
*/

loadScores();

</script>

</body>
</html>
