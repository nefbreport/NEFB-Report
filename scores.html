       SCORE SECTIONS

    .date-section {

    .team {

    .team-name {

      font-weight: 700;
      min-width: 0;
    }

    .record {
      color: #777;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .score {
      font-size: 18px;
      font-weight: 900;
      text-align: right;
    }

    .winner .team-name,
    .winner .score {
      font-weight: 900;
    }

    .game-footer {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #eee;

      font-size: 11px;

      color: #777;
      text-transform: uppercase;
    }

    .association-label {
      display: inline-block;

      background: #111;
      color: #fff;

      padding: 3px 6px;
      border-radius: 4px;

      letter-spacing: .5px;

    /* =========================
       MESSAGES
    ========================= */

    #loading {

      padding: 50px;
      color: #666;
    }

    #error {
      display: none;
      background: #ffe7e7;
      padding: 18px;
      border-radius: 8px;
      margin-top: 20px;
    }

    .no-games {
      background: white;
      padding: 25px;

      color: #666;

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .header-inner {
        min-height: auto;
        flex-direction: column;
        align-items: flex-start;

        padding-top: 12px;
        padding-bottom: 15px;

        gap: 10px;
      }

      .logo img {
        height: 65px;
        width: 130px;
      }

      nav {
        width: 100%;
        gap: 14px;
        flex-wrap: wrap;
      }

      nav a {
        font-size: 11px;
      }

      h1 {
        font-size: 30px;
      }

      .filters {
        flex-direction: column;
      }

      select {
        width: 100%;
      }

      .team {
        grid-template-columns: 58px minmax(0, 1fr) auto 38px;
        gap: 7px;
      }

      .association {
        font-size: 9px;
      }

      .team-name {
        font-size: 14px;
      }

      .record {
        font-size: 11px;
      }

      .score {
        font-size: 17px;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="header-inner">

    <a class="logo" href="index.html">
      <img src="nefb-logo.jpg" alt="NEFB Report">
    </a>

    <nav>
      <a href="index.html">Home</a>
      <a href="scores.html">Scores</a>
      <a href="teams.html">Teams</a>
      <a href="rankings.html">Rankings</a>
      <a href="recruiting.html">Recruiting</a>
      <a href="news.html">News</a>
      <a href="about.html">About</a>
    </nav>

  </div>

</header>



<main class="container">

  <h1>
    New England Football Scores
  </h1>

  <div class="subtitle">
    High school and prep football scores from across New England.
  </div>


  <div class="filters">

    <select id="weekFilter">

      <option value="all">
        All Dates
      </option>

    </select>


    <select id="associationFilter">

      <option value="all">
        All Associations
      </option>

    </select>

  </div>


  <div id="loading">
    Loading scores...
  </div>


  <div id="error">
    Scores could not be loaded.
  </div>


  <div id="scores"></div>

</main>



<script>


/*
=========================================
GOOGLE SHEET
=========================================
*/

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTmxfGq5QWxATSTWk3V0ZZMyukHkw4kBamLh6xOhe4qqKeMi-T_zxNtFHZDPoSv8c-puqUWoW60v2X8/pub?gid=0&single=true&output=csv";


let allGames = [];



/*
=========================================
LOAD SCORES
=========================================
*/

async function loadScores() {

  try {

    const response =
      await fetch(SHEET_URL);


    if (!response.ok) {

      throw new Error(
        "Could not load spreadsheet"
      );

    }


    const csv =
      await response.text();


    const rows =
      parseCSV(csv);


    if (rows.length < 2) {

      throw new Error(
        "Spreadsheet is empty"
      );

    }


    const headers =
      rows[0].map(
        header => header.trim()
      );


    allGames =
      rows
        .slice(1)

        .filter(
          row =>
            row.some(
              cell =>
                cell.trim() !== ""
            )
        )

        .map(
          (row, index) => {

            const game = {};


            headers.forEach(
              (header, columnIndex) => {

                game[header] =
                  row[columnIndex]
                    ? row[columnIndex].trim()
                    : "";

              }
            );


            game._originalIndex =
              index;


            return game;

          }
        );


    prepareGames();

    buildWeekFilter();

    buildAssociationFilter();


    document
      .getElementById(
        "loading"
      )
      .style.display =
        "none";


    renderScores();

  }


  catch (error) {

    console.error(error);


    document
      .getElementById(
        "loading"
      )
      .style.display =
        "none";


    document
      .getElementById(
        "error"
      )
      .style.display =
        "block";

  }

}



/*
=========================================
CSV PARSER
=========================================
*/

function parseCSV(text) {

  const rows = [];

  let row = [];

  let cell = "";

  let insideQuotes = false;


  for (
    let i = 0;
    i < text.length;
    i++
  ) {

    const character =
      text[i];

    const nextCharacter =
      text[i + 1];


    if (
      character === '"'
    ) {

      if (
        insideQuotes &&
        nextCharacter === '"'
      ) {

        cell += '"';

        i++;

      }

      else {

        insideQuotes =
          !insideQuotes;

      }

    }


    else if (
      character === "," &&
      !insideQuotes
    ) {

      row.push(cell);

      cell = "";

    }


    else if (
      (
        character === "\n" ||
        character === "\r"
      ) &&
      !insideQuotes
    ) {

      if (
        character === "\r" &&
        nextCharacter === "\n"
      ) {

        i++;

      }


      row.push(cell);

      rows.push(row);


      row = [];

      cell = "";

    }


    else {

      cell += character;

    }

  }


  if (
    cell.length ||
    row.length
  ) {

    row.push(cell);

    rows.push(row);

  }


  return rows;

}



/*
=========================================
NORMALIZE WEEK
=========================================
*/

function normalizeWeek(week) {

  return String(
    week || ""
  )

    .replace(
      /week\s*/i,
      ""
    )

    .trim();

}



/*
=========================================
DATE VALUE
=========================================
*/

function getDateValue(dateString) {

  if (!dateString) {

    return 0;

  }


  const parts =
    dateString.split("/");


  if (
    parts.length === 3
  ) {

    const month =
      Number(parts[0]);

    const day =
      Number(parts[1]);

    const year =
      Number(parts[2]);


    return new Date(
      year,
      month - 1,
      day
    ).getTime();

  }


  return (
    new Date(
      dateString
    ).getTime() || 0
  );

}



/*
=========================================
DATE FORMAT
=========================================
*/

function formatDate(dateString) {

  if (!dateString) {

    return "";

  }


  const parts =
    dateString.split("/");


  if (
    parts.length === 3
  ) {

    const month =
      Number(parts[0]);

    const day =
      Number(parts[1]);

    const year =
      Number(parts[2]);


    const date =
      new Date(
        year,
        month - 1,
        day
      );


    return date.toLocaleDateString(
      "en-US",
      {

        weekday:
          "long",

        month:
          "long",

        day:
          "numeric"

      }
    );

  }


  return dateString;

}



/*
=========================================
SHORT MONTH
=========================================
*/

function getShortMonth(
  monthNumber
) {

  const months = [

    "Jan.",
    "Feb.",
    "Mar.",
    "Apr.",
    "May",
    "June",
    "July",
    "Aug.",
    "Sept.",
    "Oct.",
    "Nov.",
    "Dec."

  ];


  return (
    months[
      monthNumber - 1
    ] || ""
  );

}



/*
=========================================
CREATE DATE RANGE
=========================================
*/

function createDateRange(
  startDateString,
  endDateString
) {

  const startParts =
    startDateString.split("/");


  const endParts =
    endDateString.split("/");


  if (
    startParts.length !== 3 ||
    endParts.length !== 3
  ) {

    return (
      startDateString +
      " – " +
      endDateString
    );

  }


  const startMonth =
    Number(startParts[0]);


  const startDay =
    Number(startParts[1]);


  const endMonth =
    Number(endParts[0]);


  const endDay =
    Number(endParts[1]);


  if (
    startMonth ===
    endMonth
  ) {

    return (
      getShortMonth(
        startMonth
      ) +
      " " +
      startDay +
      "–" +
      endDay
    );

  }


  return (

    getShortMonth(
      startMonth
    ) +

    " " +

    startDay +

    " – " +

    getShortMonth(
      endMonth
    ) +

    " " +

    endDay

  );

}



/*
=========================================
SAFE HTML
=========================================
*/

function escapeHTML(value) {

  return String(
    value || ""
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



/*
=========================================
NORMALIZE TEAM NAME
=========================================
*/

function normalizeTeamName(name) {

  return String(
    name || ""
  )

    .toLowerCase()

    .replace(
      /[.’']/g,
      ""
    )

    .replace(
      /&/g,
      "and"
    )

    .replace(
      /-/g,
      " "
    )

    .replace(
      /\s+/g,
      " "
    )

    .trim();

}



/*
=========================================
CHECK IF GAME IS FINAL
=========================================
*/

function isFinalGame(game) {

  return String(
    game["Status"] || ""
  )

    .toLowerCase()

    .includes(
      "final"
    );

}



/*
=========================================
CALCULATE TEAM RECORDS
=========================================

Record shown is the team's
record AFTER that game.

=========================================
*/

function prepareGames() {

  const chronologicalGames =
    [...allGames]

      .sort(
        (a, b) => {

          const dateDifference =

            getDateValue(
              a["Date"]
            )

            -

            getDateValue(
              b["Date"]
            );


          if (
            dateDifference !== 0
          ) {

            return dateDifference;

          }


          return (
            a._originalIndex -
            b._originalIndex
          );

        }
      );


  const records = {};


  chronologicalGames.forEach(
    game => {

      const awayTeam =
        normalizeTeamName(
          game["Away Team"]
        );


      const homeTeam =
        normalizeTeamName(
          game["Home Team"]
        );


      if (
        !records[awayTeam]
      ) {

        records[awayTeam] = {

          wins: 0,
          losses: 0,
          ties: 0

        };

      }


      if (
        !records[homeTeam]
      ) {

        records[homeTeam] = {

          wins: 0,
          losses: 0,
          ties: 0

        };

      }


      if (
        isFinalGame(game)
      ) {

        const awayScore =
          Number(
            game["Away Score"]
          );


        const homeScore =
          Number(
            game["Home Score"]
          );


        if (
          Number.isFinite(
            awayScore
          ) &&
          Number.isFinite(
            homeScore
          )
        ) {


          if (
            awayScore >
            homeScore
          ) {

            records[
              awayTeam
            ].wins++;


            records[
              homeTeam
            ].losses++;

          }


          else if (
            homeScore >
            awayScore
          ) {

            records[
              homeTeam
            ].wins++;


            records[
              awayTeam
            ].losses++;

          }


          else {

            records[
              awayTeam
            ].ties++;


            records[
              homeTeam
            ].ties++;

          }

        }

      }


      game._awayRecord =
        formatRecord(
          records[
            awayTeam
          ]
        );


      game._homeRecord =
        formatRecord(
          records[
            homeTeam
          ]
        );

    }
  );

}



/*
=========================================
FORMAT RECORD
=========================================
*/

function formatRecord(record) {

  if (!record) {

    return "0-0";

  }


  if (
    record.ties > 0
  ) {

    return (

      record.wins +

      "-" +

      record.losses +

      "-" +

      record.ties

    );

  }


  return (

    record.wins +

    "-" +

    record.losses

  );

}



/*
=========================================
AUTOMATIC DATE RANGE FILTER
=========================================
*/

function buildWeekFilter() {

  const weekFilter =
    document.getElementById(
      "weekFilter"
    );


  const weeks = {};


  allGames.forEach(
    game => {

      const week =
        normalizeWeek(
          game["Week"]
        );


      const date =
        game["Date"];


      if (
        !week ||
        !date
      ) {

        return;

      }


      if (
        !weeks[week]
      ) {

        weeks[week] = [];

      }


      weeks[week].push(
        date
      );

    }
  );


  const weekNumbers =
    Object.keys(
      weeks
    )

      .sort(
        (a, b) => {

          const numberA =
            Number(a);

          const numberB =
            Number(b);


          if (
            Number.isFinite(
              numberA
            ) &&
            Number.isFinite(
              numberB
            )
          ) {

            return (
              numberA -
              numberB
            );

          }


          return (
            a.localeCompare(b)
          );

        }
      );


  weekNumbers.forEach(
    week => {

      const dates =
        weeks[week]

          .sort(
            (a, b) =>

              getDateValue(a) -
              getDateValue(b)

          );


      const firstDate =
        dates[0];


      const lastDate =
        dates[
          dates.length - 1
        ];


      const label =
        createDateRange(
          firstDate,
          lastDate
        );


      const option =
        document.createElement(
          "option"
        );


      option.value =
        week;


      option.textContent =
        label;


      weekFilter.appendChild(
        option
      );

    }
  );

}



/*
=========================================
ASSOCIATION FILTER
=========================================
*/

function buildAssociationFilter() {

  const associationFilter =
    document.getElementById(
      "associationFilter"
    );


  const associations = [

    "MIAA",
    "CIAC",
    "RIIL",
    "NHIAA",
    "MPA",
    "VPA",
    "NEPSAC"

  ];


  associations.forEach(
    association => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        association;


      option.textContent =
        association;


      associationFilter
        .appendChild(
          option
        );

    }
  );

}



/*
=========================================
DISPLAY SCORES
=========================================
*/

function renderScores() {

  const scoresContainer =
    document.getElementById(
      "scores"
    );


  const selectedWeek =
    document.getElementById(
      "weekFilter"
    ).value;


  const selectedAssociation =
    document.getElementById(
      "associationFilter"
    ).value;


  let games =
    allGames.filter(
      game => {

        const weekMatches =

          selectedWeek ===
            "all"

          ||

          normalizeWeek(
            game["Week"]
          ) ===
            selectedWeek;


        const associationMatches =

          selectedAssociation ===
            "all"

          ||

          game[
            "Away Association"
          ] ===
            selectedAssociation

          ||

          game[
            "Home Association"
          ] ===
            selectedAssociation;


        return (

          weekMatches &&

          associationMatches

        );

      }
    );


  games.sort(
    (a, b) => {

      const dateDifference =

        getDateValue(
          a["Date"]
        )

        -

        getDateValue(
          b["Date"]
        );


      if (
        dateDifference !== 0
      ) {

        return dateDifference;

      }


      return (
        a._originalIndex -
        b._originalIndex
      );

    }
  );


  if (
    !games.length
  ) {

    scoresContainer.innerHTML =

      '<div class="no-games">No games found for these filters.</div>';


    return;

  }


  const groupedGames = {};


  games.forEach(
    game => {

      const date =

        game["Date"] ||

        "Unknown Date";


      if (
        !groupedGames[
          date
        ]
      ) {

        groupedGames[
          date
        ] = [];

      }


      groupedGames[
        date
      ].push(
        game
      );

    }
  );


  let html = "";


  Object
    .keys(
      groupedGames
    )

    .forEach(
      date => {

        html += `

          <section class="date-section">

            <div class="date-title">

              ${escapeHTML(
                formatDate(
                  date
                )
              )}

            </div>

        `;


        groupedGames[
          date
        ]

          .forEach(
            game => {

              const awayScore =
                Number(
                  game[
                    "Away Score"
                  ]
                );


              const homeScore =
                Number(
                  game[
                    "Home Score"
                  ]
                );


              const awayWinner =

                isFinalGame(
                  game
                )

                &&

                Number.isFinite(
                  awayScore
                )

                &&

                Number.isFinite(
                  homeScore
                )

                &&

                awayScore >
                  homeScore;


              const homeWinner =

                isFinalGame(
                  game
                )

                &&

                Number.isFinite(
                  awayScore
                )

                &&

                Number.isFinite(
                  homeScore
                )

                &&

                homeScore >
                  awayScore;


              const awayAssociation =

                game[
                  "Away Association"
                ]

                || "";


              const homeAssociation =

                game[
                  "Home Association"
                ]

                || "";


              let associationLabel =
                "";


              if (
                awayAssociation ===
                  homeAssociation

                &&

                awayAssociation
              ) {

                associationLabel =
                  awayAssociation;

              }


              else if (
                awayAssociation ||
                homeAssociation
              ) {

                associationLabel =

                  [
                    awayAssociation,
                    homeAssociation
                  ]

                    .filter(
                      Boolean
                    )

                    .join(
                      " vs "
                    );

              }


              html += `


                <div class="game">


                  <div
                    class="team ${
                      awayWinner
                        ? "winner"
                        : ""
                    }"
                  >


                    <div class="association">

                      ${escapeHTML(
                        awayAssociation
                      )}

                    </div>


                    <div class="team-name">

                      ${escapeHTML(
                        game[
                          "Away Team"
                        ]
                      )}

                    </div>


                    <div class="record">

                      (${escapeHTML(
                        game._awayRecord
                          || "0-0"
                      )})

                    </div>


                    <div class="score">

                      ${escapeHTML(
                        game[
                          "Away Score"
                        ]
                      )}

                    </div>


                  </div>



                  <div
                    class="team ${
                      homeWinner
                        ? "winner"
                        : ""
                    }"
                  >


                    <div class="association">

                      ${escapeHTML(
                        homeAssociation
                      )}

                    </div>


                    <div class="team-name">

                      ${escapeHTML(
                        game[
                          "Home Team"
                        ]
                      )}

                    </div>


                    <div class="record">

                      (${escapeHTML(
                        game._homeRecord
                          || "0-0"
                      )})

                    </div>


                    <div class="score">

                      ${escapeHTML(
                        game[
                          "Home Score"
                        ]
                      )}

                    </div>


                  </div>



                  <div class="game-footer">


                    ${escapeHTML(

                      game[
                        "Status"
                      ]

                      ||

                      "Final"

                    )}


                    &nbsp; • &nbsp;


                    ${escapeHTML(

                      formatDate(
                        game[
                          "Date"
                        ]
                      )

                    )}


                    ${
                      associationLabel

                        ? `

                          <span class="association-label">

                            ${escapeHTML(
                              associationLabel
                            )}

                          </span>

                        `

                        : ""
                    }


                  </div>


                </div>


              `;

            }
          );


        html +=
          `</section>`;

      }
    );


  scoresContainer.innerHTML =
    html;

}



/*
=========================================
FILTER EVENTS
=========================================
*/

document
  .getElementById(
    "weekFilter"
  )
  .addEventListener(
    "change",
    renderScores
  );


document
  .getElementById(
    "associationFilter"
  )
  .addEventListener(
    "change",
    renderScores
  );



/*
=========================================
START WEBSITE
=========================================
*/

loadScores();


</script>


</body>

</html>
